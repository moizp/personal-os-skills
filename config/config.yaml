# Personal OS config template
# Copy this to config.yaml and fill in your own values.
# Skills read this file at runtime — do not hardcode personal details in skills/.

user:
  name: "Moiz"
  timezone: "Pacific/Auckland"
  locale: "en-NZ"               # British/NZ spelling: organise, prioritise, behaviour

frameworks:
  # Comment out any you don't use. Order = priority when frameworks conflict.
  - seven_habits
  - atomic_habits
  - gtd
  - lean
  - ikigai                    # long-term direction; used by long-term-goal-setting
  # - culture_code            # uncomment if applying this to a team, not just yourself

goals:
  horizons: [3, 6, 9, 12]      # months
  artefact_name: "quarterly-goals"   # name of the Claude artefact / tracker
  long_term_artefact_name: "long-term-goals"   # see long-term-goal-setting; not year-scoped
  # If goals should map to Covey "roles," list them here (optional)
  roles: ["Colleague", "Leader", "Parent", "Community Member", "Author", "Friend"]

todo_backend:
  type: "connector"            # one of: reminders | yjs | connector
  # --- connector-specific (if todo_backend.type == connector) ---
  connector:
    name: "todoist"
    todoist:
      # Inbox is built-in (project id "inbox"). Someday/Maybe must be a
      # real project you create yourself — see docs/todoist-setup.md.
      someday_maybe_project: "Someday/Maybe"
      # Sections are real and scriptable via add-sections/find-sections —
      # unlike Reminders, a skill can create these itself for a new
      # project, not just read them.
      kanban_sections: ["Backlog", "Next", "Doing", "Done", "Archived"]
      label_prefix: "goal-"    # native Todoist labels, e.g. "goal-launch-x"
  # --- reminders-specific (kept for reference/forkability — see
  # docs/reminders-setup.md and README's "Lessons learned" section for why
  # this isn't the active backend: it works, but Reminders' AppleScript/JXA
  # bridge has a large per-list overhead that made get_due_todos-style
  # queries unreliably slow once past a handful of lists) ---
  reminders:
    lists:
      inbox: "Inbox"
      someday_maybe: "Someday/Maybe"
    kanban_sections: ["Backlog", "Next", "Doing", "Done", "Archived"]
    tag_prefix: "#goal-"       # tags used to link tasks back to a quarterly goal
  # --- yjs-specific (if todo_backend.type == yjs) ---
  yjs:
    relay_url: ""
    default_room: ""           # your personal room ID

review_cadence:
  daily_planning_time: "07:30"
  weekly_review_day: "sunday"
  weekly_review_time: "19:00"
  quarterly_review: "last week of each quarter"

notes:
  # Free text — anything a skill should always know about how you work.
  # Keep this short; long personal context belongs in your Claude Project,
  # not in this repo.
  ""
