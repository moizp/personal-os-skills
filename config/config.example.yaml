# Personal OS config template
# Copy this to config.yaml and fill in your own values.
# Skills read this file at runtime — do not hardcode personal details in skills/.

user:
  name: ""                     # e.g. "Alex"
  timezone: ""                 # IANA identifier, e.g. "America/New_York"
  locale: ""                   # e.g. "en-US" | "en-GB" | "en-NZ" | "en-AU"
                                # — drives spelling convention: en-GB/en-NZ/
                                # en-AU use British spelling (organise,
                                # prioritise, behaviour); en-US uses American
                                # spelling (organize, prioritize, behavior).

frameworks:
  # Comment out any you don't use. Order = priority when frameworks conflict.
  - seven_habits
  - atomic_habits
  - gtd
  - lean
  # - ikigai                  # long-term direction (see long-term-goal-setting) —
                               # uncomment along with seven_habits to use it
  # - culture_code            # uncomment if applying this to a team, not just yourself

goals:
  horizons: [3, 6, 9, 12]      # months
  artefact_name: "quarterly-goals"   # name of the Claude artefact / tracker
  long_term_artefact_name: "long-term-goals"   # see long-term-goal-setting;
                                                # not year-scoped, unlike the above
  # If goals should map to Covey "roles," list them here (optional)
  roles: []                    # e.g. ["Parent", "Engineer", "Health", "Community"]

todo_backend:
  type: "connector"            # one of: reminders | yjs | connector
  # --- connector-specific (if todo_backend.type == connector) ---
  # Recommended default — see docs/todoist-setup.md and README's "Lessons
  # learned" section. Uses Claude's official Todoist connector (Settings →
  # Connectors), so there's no local server to run and no macOS-only
  # constraint, unlike the reminders option below.
  connector:
    name: "todoist"
    todoist:
      # Inbox is built-in (project id "inbox"). Someday/Maybe must be a
      # real project you create yourself.
      someday_maybe_project: "Someday/Maybe"
      # Sections are real and scriptable (add-sections/find-sections) —
      # a skill can create these itself for a new project, not just read
      # them, unlike the Reminders option below.
      kanban_sections: ["Backlog", "Next", "Doing", "Done", "Archived"]
      label_prefix: "goal-"    # native Todoist labels, e.g. "goal-launch-x"
  # --- reminders-specific (alternative option — see docs/reminders-setup.md.
  # Works, but has a real limitation worth knowing before choosing it: the
  # AppleScript/JXA bridge has a large, roughly fixed per-list overhead
  # (seconds, not milliseconds) that made horizon-style queries (get_due_todos)
  # unreliably slow once past a handful of lists — see README's "Lessons
  # learned" section for the full story before picking this over Todoist.) ---
  reminders:
    # Only REAL Reminders lists go here. "Today"/"This Week"/"This
    # Month"/"This Quarter" are NOT real lists — they're Smart Lists
    # (computed views) and aren't readable/writable via AppleScript/JXA.
    lists:
      inbox: "Inbox"
      # A REAL list — must not share a name with any Smart List you've
      # created (e.g. a custom "no due date" filter list). Smart Lists,
      # built-in or custom, are invisible to AppleScript/JXA either way.
      someday_maybe: "Someday/Maybe"
    # IMPORTANT: every list here (and every project list) must be a
    # top-level list — NOT inside a Reminders "Group" (folder). Groups
    # are also invisible to AppleScript/JXA. Use a naming prefix instead
    # if you want visual organisation, e.g. "Work — Launch X".
    # NOTE: Kanban sections are not scriptable at all here (AppleScript
    # limitation) — this list is for one-time manual setup only.
    kanban_sections: ["Backlog", "Next", "Doing", "Done", "Archived"]
    tag_prefix: "#goal-"       # tags used to link tasks back to a quarterly goal
  # --- yjs-specific (if todo_backend.type == yjs) ---
  yjs:
    relay_url: ""
    default_room: ""           # your personal room ID

review_cadence:
  daily_planning_time: "07:30"
  weekly_review_day: "sunday"
  weekly_review_time: "17:00"
  quarterly_review: "last week of each quarter"

notes:
  # Free text — anything a skill should always know about how you work.
  # Keep this short; long personal context belongs in your Claude Project,
  # not in this repo.
  ""
