# SAMPLE config — a real filled-in example, based on the conversation that
# produced this repo. Copy config.example.yaml instead of this file when
# setting up your own — this one is here purely as a worked example.

user:
  name: "Sample User"
  timezone: "America/Los_Angeles"
  locale: "en-US"

frameworks:
  - seven_habits
  - atomic_habits
  - gtd
  - lean
  - ikigai

goals:
  horizons: [3, 6, 9, 12]
  artefact_name: "quarterly-goals"
  long_term_artefact_name: "long-term-goals"
  roles:
    - "Health"
    - "Career"
    - "Family"
    - "Personal Growth"

todo_backend:
  type: "connector"
  connector:
    name: "todoist"
    todoist:
      someday_maybe_project: "Someday/Maybe"
      kanban_sections: ["Backlog", "Next", "Doing", "Done", "Archived"]
      label_prefix: "goal-"
  yjs:
    relay_url: ""
    default_room: ""

review_cadence:
  daily_planning_time: "07:30"
  weekly_review_day: "sunday"
  weekly_review_time: "17:00"
  quarterly_review: "last week of each quarter"

notes: >
  Project boards are per-goal, not per-project-in-general — each active
  quarterly goal that needs multi-step tracking gets its own Todoist
  project with Kanban sections. Sections track workflow status; due dates
  track the actual deadline — the two are independent, don't force one to
  match the other.
